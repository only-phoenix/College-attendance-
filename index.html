<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>College Attendance</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>🎓 College Attendance</h1>
        <p class="subtitle">My Attendance Dashboard</p>

        <!-- Navigation -->
        <div class="navigation">
            <button onclick="showPage('timetablePage')">
                📅 Timetable
            </button>

            <button onclick="showPage('attendancePage')">
                ✅ Attendance
            </button>

            <button onclick="showPage('calculatorPage')">
                📊 Calculator
            </button>
        </div>


        <!-- TIMETABLE PAGE -->
        <div id="timetablePage" class="page">

            <h2>📚 My Timetable</h2>

            <div id="timetable"></div>

        </div>


       <!-- attendance page -->
        <div id="attendancePage" class="page hidden">

    <h2>✅ Attendance</h2>

    <div class="calendar-container">

        <div class="calendar-header">
            <button onclick="changeMonth(-1)">‹</button>

            <h3 id="monthYear"></h3>

            <button onclick="changeMonth(1)">›</button>
        </div>

        <div class="calendar-weekdays">
            <div>Mon</div>
            <div>Tue</div>
            <div>Wed</div>
            <div>Thu</div>
            <div>Fri</div>
            <div>Sat</div>
            <div>Sun</div>
        </div>

        <div id="calendar" class="calendar"></div>

    </div>

    <p id="selectedDate" class="selected-date">
        Select a date
    </p>

</div>


        <!-- CALCULATOR PAGE -->
        <div id="calculatorPage" class="page hidden">

            <h2>📊 Attendance Calculator</h2>

            <p class="coming-soon">
                Attendance calculations will appear here.
            </p>

        </div>

    </div>

    <script src="apps.js"></script>

</body>

</html>
