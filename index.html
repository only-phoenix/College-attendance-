            <!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>College Attendance</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>🎓 College Attendance</h1>
        <p class="subtitle">My Attendance Dashboard</p>


        <!-- ================= NAVIGATION ================= -->

        <div class="navigation">

            <button onclick="showPage('timetablePage')">
                📅 Timetable
            </button>

            <button onclick="showPage('attendancePage')">
                ✅ Attendance
            </button>

            <button onclick="showPage('calculatorPage')">
                📊 Calculator
            </button>

        </div>


        <!-- ================= TIMETABLE PAGE ================= -->

        <div id="timetablePage" class="page">

            <h2>📚 My Timetable</h2>

            <div id="timetable"></div>

        </div>


        <!-- ================= ATTENDANCE PAGE ================= -->

        <div id="attendancePage" class="page hidden">

            <h2>✅ Attendance</h2>


            <!-- Calendar -->

            <div class="calendar-container">

                <div class="calendar-header">

                    <button onclick="changeMonth(-1)">
                        ‹
                    </button>

                    <h3 id="monthYear"></h3>

                    <button onclick="changeMonth(1)">
                        ›
                    </button>

                </div>


                <!-- Weekdays -->

                <div class="calendar-weekdays">

                    <div>Mon</div>
                    <div>Tue</div>
                    <div>Wed</div>
                    <div>Thu</div>
                    <div>Fri</div>
                    <div>Sat</div>
                    <div>Sun</div>

                </div>


                <!-- Dates -->

                <div id="calendar" class="calendar"></div>

            </div>


            <!-- Selected date -->

            <p id="selectedDate" class="selected-date">
                Select a date
            </p>


            <!-- ================= DAILY ATTENDANCE ================= -->

            <div id="dailyAttendance" class="attendance-section">

                <div class="attendance-empty">

                    <div class="empty-icon">
                        📅
                    </div>

                    <h3>Select a date</h3>

                    <p>
                        Select a date from the calendar
                        to see your lectures.
                    </p>

                </div>


        <!-- ================= CALCULATOR PAGE ================= -->

<div id="calculatorPage" class="page hidden">

    <h2>📊 Attendance Calculator</h2>

    <p class="calculator-subtitle">
        Your subject-wise attendance
    </p>

    <div id="attendanceCalculator" class="calculator-grid">

        <!-- Subject cards will appear here -->

    </div>

</div>

    <script src="apps.js"></script>

</body>

</html>
